name: Game Deals Bot

on:
  schedule:
    # Запуск каждые 3 часа. Время в UTC.
    # Изменить частоту можно, поправив это выражение (формат cron).
    - cron: '0 */3 * * *'
  workflow_dispatch: {}   # позволяет запускать вручную кнопкой во вкладке Actions

# Нужно, чтобы бот мог сохранить (закоммитить) обновлённый state.json обратно в репозиторий
permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Save updated state back to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Обновление списка опубликованного [skip ci]"
          git push
