name: Game Deals Bot

on:
  schedule:
    # Родное расписание GitHub Actions иногда работает ненадёжно (может
    # запускаться раз в час-два вместо каждых 5 минут — это известная
    # особенность самого GitHub, не этого проекта). Поэтому оставляем
    # его как дополнительный, а не единственный способ запуска — см.
    # README, раздел "Надёжный автозапуск", про внешний планировщик,
    # который дёргает workflow_dispatch (ниже) каждые несколько минут
    # напрямую через API GitHub в обход этого расписания.
    - cron: '3-59/5 * * * *'
  workflow_dispatch: {}   # запускается вручную кнопкой, а также внешним планировщиком по API

# Нужно, чтобы бот мог сохранить (закоммитить) обновлённый state.json обратно в репозиторий
permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    # Если предыдущий запуск ещё не закончился — не запускаем поверх него
    # ещё один, а ставим в очередь. Это важно именно потому, что состояние
    # (state.json) хранится в самом репозитории: два одновременных запуска
    # могли бы конфликтовать при сохранении и "терять" часть данных.
    concurrency:
      group: game-deals-bot
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'   # ускоряет установку зависимостей на повторных запусках

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Save updated state back to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json

          if git diff --staged --quiet; then
            echo "state.json не изменился — сохранять нечего."
            exit 0
          fi

          git commit -m "Обновление состояния бота [skip ci]"

          # На случай, если другой запуск успел запушить изменения первым:
          # подтягиваем их и пробуем снова, а не теряем молча своё состояние.
          success=0
          for attempt in 1 2 3 4 5; do
            if git push; then
              success=1
              break
            fi
            echo "git push не прошёл (попытка $attempt/5) — подтягиваю свежие изменения и пробую снова"
            git pull --rebase --autostash
            sleep 3
          done

          if [ "$success" -ne 1 ]; then
            echo "::error::Не удалось сохранить state.json после 5 попыток. Публикации в этом запуске уже отправлены в Telegram, но статус 'опубликовано' мог не сохраниться — в следующем запуске эти же материалы могут повториться."
            exit 1
          fi
